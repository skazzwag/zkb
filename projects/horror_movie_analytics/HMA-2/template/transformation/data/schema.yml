version: 2

seeds:
  - name: example_events
    description: Example event seed used by the template model slice.
    columns:
      - name: event_id
        data_type: integer
        description: Unique event identifier
        data_tests:
          - not_null
          - unique
      - name: event_name
        data_type: varchar
        description: Event type name
        data_tests:
          - not_null
      - name: occurred_at
        data_type: timestamp
        description: When the event happened
        data_tests:
          - not_null

version: 2

models:
  - name: stg_example_events
    description: Cleaned example events from the template seed.
    columns:
      - name: event_id
        data_type: integer
        description: Unique event identifier
        data_tests:
          - not_null
          - unique
      - name: event_name
        data_type: varchar
        description: Normalised event type name
        data_tests:
          - not_null
      - name: occurred_at
        data_type: timestamp
        description: When the event happened
        data_tests:
          - not_null

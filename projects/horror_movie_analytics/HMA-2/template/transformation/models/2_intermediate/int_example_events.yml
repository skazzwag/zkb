version: 2

models:
  - name: int_example_events
    description: Example events with derived flags.
    columns:
      - name: event_id
        data_type: integer
        description: Unique event identifier
        data_tests:
          - not_null
          - unique
      - name: event_name
        data_type: varchar
        description: Normalised event type name
        data_tests:
          - not_null
      - name: occurred_at
        data_type: timestamp
        description: When the event happened
        data_tests:
          - not_null
      - name: is_deleted
        data_type: boolean
        description: True when the event type is deleted
        data_tests:
          - not_null

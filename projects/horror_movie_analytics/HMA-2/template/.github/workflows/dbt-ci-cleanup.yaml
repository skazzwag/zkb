name: Cleanup dbt PR Schema

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write
  packages: read
  repository-projects: read

env:
  MOTHERDUCK_CI_TOKEN: ${{ secrets.MOTHERDUCK_CI_TOKEN }}
  MOTHERDUCK_CI_DATABASE: ${{ vars.MOTHERDUCK_CI_DATABASE }}
  MOTHERDUCK_CI_SCHEMA: ${{ vars.MOTHERDUCK_CI_SCHEMA }}

  AZURE_CONNECTION_STRING_GLOBAL: ${{ secrets.AZURE_CONNECTION_STRING_GLOBAL }}
  AZURE_CONNECTION_STRING_US: ${{ secrets.AZURE_CONNECTION_STRING_US }}

jobs:
  get-branch-info:
    runs-on: ubuntu-latest
    outputs:
      schema-name: ${{ steps.sanitize-branch.outputs.schema-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanitize branch name for MD schema
        id: sanitize-branch
        uses: ./.github/actions/sanitize-branch-name
        with:
          branch-name: ${{ github.head_ref }}
          base-schema: ${{ vars.MOTHERDUCK_CI_SCHEMA }}
          pr-number: ${{ github.event.number }}

  cleanup-ci-schema:
    needs: get-branch-info
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'dbt')
    env:
      MOTHERDUCK_CI_SCHEMA: ${{ needs.get-branch-info.outputs.schema-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Cleanup CI schema
        working-directory: ./transformation
        run: |
          SCHEMA_NAME="${{ needs.get-branch-info.outputs.schema-name }}"
          uv run dbt deps --target ci
          uv run dbt run-operation drop_schema --args "{schema_name: $SCHEMA_NAME}" --target ci

name: dbt CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

defaults:
  run:
    shell: bash
env:
  MOTHERDUCK_CI_TOKEN: ${{ secrets.MOTHERDUCK_CI_TOKEN }}
  MOTHERDUCK_CI_DATABASE: ${{ vars.MOTHERDUCK_CI_DATABASE }}
  MOTHERDUCK_CI_SCHEMA: ${{ vars.MOTHERDUCK_CI_SCHEMA }}

  AZURE_CONNECTION_STRING_GLOBAL: ${{ secrets.AZURE_CONNECTION_STRING_GLOBAL }}
  AZURE_CONNECTION_STRING_US: ${{ secrets.AZURE_CONNECTION_STRING_US }}

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      schema-name: ${{ steps.sanitize-branch.outputs.schema-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanitize branch name for MD schema
        id: sanitize-branch
        uses: ./.github/actions/sanitize-branch-name
        with:
          branch-name: ${{ github.head_ref }}
          base-schema: ${{ vars.MOTHERDUCK_CI_SCHEMA }}
          pr-number: ${{ github.event.number }}

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            transformation:
              - 'transformation/**'
            dbt-ci:
              - '.github/workflows/dbt-ci.yaml'
              - '.github/workflows/dbt-ci-cleanup.yaml'
              - '.github/actions/sanitize-branch-name/action.yaml'
            dependencies:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'

      - name: Add dbt label to PR
        uses: actions/github-script@v7
        if: |
          steps.filter.outputs.transformation == 'true' ||
          steps.filter.outputs.dbt-ci == 'true' ||
          steps.filter.outputs.dependencies == 'true'
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['dbt']
            });

      - name: Check draft status and path changes
        id: check
        run: |
          # Check if PR is draft
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "PR is in draft mode - skipping CI"
            echo "should-run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if relevant files changed
          if [ "${{ steps.filter.outputs.transformation }}" = "true" ] || \
             [ "${{ steps.filter.outputs.dbt-ci }}" = "true" ] || \
             [ "${{ steps.filter.outputs.dependencies }}" = "true" ]; then
            echo "Relevant file(s) changes detected"
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant file(s) changes detected - skipping CI"
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

  run-dbt:
    runs-on: ubuntu-latest
    needs: [check-conditions]
    if: needs.check-conditions.outputs.should-run == 'true'
    env:
      MOTHERDUCK_CI_SCHEMA: ${{ needs.check-conditions.outputs.schema-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # pull_request events check out the merge of the PR into the base
        # branch. Slim CI compares that graph to the base tip below.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run dbt deps
        working-directory: ./transformation
        run: uv run dbt deps --target ci

      - name: Validate dbt project
        working-directory: ./transformation
        run: |
          uv run dbt debug --target ci
          uv run dbt parse --target ci

      # pull_request checkouts the merge of the PR into the base branch.
      # Comparing that graph to the base tip (not the merge-base) means
      # state:modified is only the PR's net change, not later main commits.
      - name: Checkout base tip for state comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dbt-state-base

      - name: Parse base branch for state comparison
        id: manifest
        continue-on-error: true
        run: |
          uv run dbt deps --target ci \
            --project-dir dbt-state-base/transformation \
            --profiles-dir dbt-state-base/transformation
          uv run dbt parse --target ci \
            --project-dir dbt-state-base/transformation \
            --profiles-dir dbt-state-base/transformation
          test -s dbt-state-base/transformation/target/manifest.json

      - name: Run dbt seed
        working-directory: ./transformation
        run: >
          uv run dbt seed
          --target ci
          --full-refresh

      # CI is a SQL/compile smoke test only. --empty still executes model SQL
      # against MotherDuck with zero-row refs/sources; it does not populate
      # data or prove tests. Authors must run changed models with data locally
      # or on dev-cloud and attach evidence on the PR (see BUGBOT.md).
      # Compare against a dbt Core parse of the PR base tip. state:modified+
      # selects changed nodes plus descendants, but --empty still needs every
      # ref'ed relation to exist, so the selection is closed over ancestors
      # with a dbt ls step (dbt has no "ancestors of a set" selector).
      # Fall back to the full project if that parse fails.
      - name: Resolve ancestry-closed selection for changed nodes
        id: ci_selection
        if: steps.manifest.outcome == 'success'
        working-directory: ./transformation
        run: |
          set -euo pipefail
          # --empty rewrites refs as "(select ... where false limit 0)", which
          # still requires every ref'ed relation to exist for catalog
          # resolution. state:modified+ selects changed nodes and their
          # descendants but not the descendants' OTHER parents, so build the
          # selection as the ancestor closure: each listed node selected with
          # the parents (+) graph operator, unioned via space-separated specs.
          # --quiet is required: dbt prints its log banner (timestamps,
          # "Running with dbt=...", warnings) to stdout, which would
          # otherwise be captured as garbage model names and break the
          # selector. The --output name results are PrintEvents, which
          # still print with --quiet.
          changed_nodes=$(uv run dbt ls \
            --quiet \
            --target ci \
            --select 'state:modified+' \
            --state ../dbt-state-base/transformation/target \
            --resource-type model \
            --output name)
          if [ -z "$(echo $changed_nodes)" ]; then
            echo "No modified models found; skipping empty model runs"
            echo "parents_args=" >> "$GITHUB_OUTPUT"
            echo "incremental_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Building ancestor-closed selection from changed nodes:"
          echo "$changed_nodes"
          parents_args=$(printf -- '+%s ' $changed_nodes)
          incremental_args=$(printf -- '+%s,config.materialized:incremental ' $changed_nodes)
          {
            echo "parents_args=$parents_args"
            echo "incremental_args=$incremental_args"
          } >> "$GITHUB_OUTPUT"

      - name: Run empty models for changed nodes
        if: steps.manifest.outcome == 'success' && steps.ci_selection.outputs.parents_args != ''
        working-directory: ./transformation
        run: >
          uv run dbt run
          --target ci
          --empty
          --full-refresh
          --select "${{ steps.ci_selection.outputs.parents_args }}"

      - name: Run empty models, full project fallback
        if: steps.manifest.outcome != 'success'
        working-directory: ./transformation
        run: >
          uv run dbt run
          --target ci
          --empty
          --full-refresh

      - name: Run empty incremental models for changed nodes
        if: steps.manifest.outcome == 'success' && steps.ci_selection.outputs.incremental_args != ''
        working-directory: ./transformation
        run: >
          uv run dbt run
          --target ci
          --empty
          --select "${{ steps.ci_selection.outputs.incremental_args }}"

      - name: Run empty incremental models, full project fallback
        if: steps.manifest.outcome != 'success'
        working-directory: ./transformation
        run: >
          uv run dbt run
          --target ci
          --select "config.materialized:incremental"
          --empty

      - name: Generate dbt docs for precommit
        working-directory: ./transformation
        run: >
          uv run dbt docs generate
          --target ci

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: transformation/target/
          retention-days: 1

  pre-commit:
    runs-on: ubuntu-latest
    needs: [check-conditions, run-dbt]
    if: needs.check-conditions.outputs.should-run == 'true'
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: transformation
      MOTHERDUCK_CI_SCHEMA: ${{ needs.check-conditions.outputs.schema-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Check for file changes
        id: file_changes
        uses: tj-actions/changed-files@v46
        with:
          separator: " "

      - name: Download dbt artifacts
        uses: actions/download-artifact@v4
        with:
          name: dbt-artifacts
          path: transformation/target/

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: "--files ${{ steps.file_changes.outputs.all_changed_files}} --hook-stage manual"
        env:
          SKIP: dbt-deps,dbt-parse,dbt-docs-generate,sqlfluff-fix,check-column-desc-are-same
